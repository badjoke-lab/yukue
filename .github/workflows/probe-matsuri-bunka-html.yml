name: Probe Matsuri Bunka HTML

on:
  push:
    branches:
      - feat/matsuri-bunka-html-fallback
    paths:
      - ".github/workflows/probe-matsuri-bunka-html.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Probe known detail HTML
        shell: bash
        run: |
          node - <<'NODE'
          for (const url of [
            "https://kunishitei.bunka.go.jp/heritage/detail/302/737",
            "https://kunishitei.bunka.go.jp/heritage/detail/302/00000901",
            "https://kunishitei.bunka.go.jp/heritage/detail/312/170",
          ]) {
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            const html = await response.text();
            console.log(`URL=${url} status=${response.status} bytes=${html.length}`);
            for (const label of ["名称", "種別２", "種別2", "所在都道府県", "所在地", "保護団体名"]) {
              const i = html.indexOf(label);
              if (i >= 0) console.log(`${label}: ${JSON.stringify(html.slice(Math.max(0, i - 180), i + 500))}`);
            }
          }
          NODE
