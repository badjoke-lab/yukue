name: Verify Matsuri national source inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-national-source-inventory.yml"
      - "config/matsuri-national-source-inventory.json"
      - "docs/matsuri-national-source-inventory.md"
      - "docs/nationwide-corpus-scaling.md"
      - "scripts/check-matsuri-national-source-inventory.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-national-source-inventory.yml"
      - "config/matsuri-national-source-inventory.json"
      - "docs/matsuri-national-source-inventory.md"
      - "docs/nationwide-corpus-scaling.md"
      - "scripts/check-matsuri-national-source-inventory.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify NCS-03 source inventory contract
        run: pnpm check:matsuri:national-source-inventory
