name: Verify Matsuri Detail C navigation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-detail-navigation.yml"
      - "apps/matsuri/src/components/MatsuriEntityDetailPage.astro"
      - "apps/matsuri/src/components/MatsuriPlaceDetailPage.astro"
      - "apps/matsuri/src/components/BrowseEntityList.astro"
      - "apps/matsuri/src/data/**"
      - "apps/matsuri/src/pages/**"
      - "packages/search/**"
      - "packages/ui/src/components/EvidenceList.astro"
      - "packages/ui/src/components/PlaceMap.astro"
      - "packages/ui/src/components/RelationList.astro"
      - "packages/ui/src/types.ts"
      - "scripts/audit-matsuri-map-utility.mjs"
      - "scripts/check-matsuri-detail-navigation.mjs"
      - "scripts/check-matsuri-map-coverage.mjs"
      - "scripts/check-matsuri-consistency.mjs"
      - "tests/browser/matsuri-detail-navigation.spec.mjs"
      - "docs/information-architecture.md"
      - "docs/matsuri-detail-c-implementation.md"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-detail-navigation.yml"
      - "apps/matsuri/src/components/MatsuriEntityDetailPage.astro"
      - "apps/matsuri/src/components/MatsuriPlaceDetailPage.astro"
      - "apps/matsuri/src/components/BrowseEntityList.astro"
      - "apps/matsuri/src/data/**"
      - "apps/matsuri/src/pages/**"
      - "packages/search/**"
      - "packages/ui/src/components/EvidenceList.astro"
      - "packages/ui/src/components/PlaceMap.astro"
      - "packages/ui/src/components/RelationList.astro"
      - "packages/ui/src/types.ts"
      - "scripts/audit-matsuri-map-utility.mjs"
      - "scripts/check-matsuri-detail-navigation.mjs"
      - "scripts/check-matsuri-map-coverage.mjs"
      - "scripts/check-matsuri-consistency.mjs"
      - "tests/browser/matsuri-detail-navigation.spec.mjs"
      - "docs/information-architecture.md"
      - "docs/matsuri-detail-c-implementation.md"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-detail-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Matsuri Pages
        run: pnpm build:matsuri:pages

      - name: Verify Detail C routes and navigation
        run: pnpm check:matsuri:detail-navigation

      - name: Verify map utility and negative fixtures
        run: pnpm check:matsuri:map-coverage

      - name: Write complete map utility inventory
        run: pnpm audit:matsuri:map-utility

      - name: Verify Detail C in a real browser
        run: pnpm exec playwright test tests/browser/matsuri-detail-navigation.spec.mjs --config=playwright.config.mjs --project=desktop-chromium

      - name: Upload map utility audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matsuri-map-utility-audit-${{ github.run_id }}
          path: artifacts/matsuri-map-utility/**
          if-no-files-found: error
          retention-days: 30

      - name: Write verification summary
        if: always()
        run: |
          echo "## Matsuri Detail C navigation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Every Festival, Tradition Unit, Folk Performance, and Organization has a real detail route" >> "$GITHUB_STEP_SUMMARY"
          echo "- Shrine and Temple seed references remain State-free" >> "$GITHUB_STEP_SUMMARY"
          echo "- Relations are navigable in both directions" >> "$GITHUB_STEP_SUMMARY"
          echo "- Places and individual JSON records are reachable" >> "$GITHUB_STEP_SUMMARY"
          echo "- Maps use a concrete shrine, temple, festival ground, performance venue, park, or other reviewed main-place anchor" >> "$GITHUB_STEP_SUMMARY"
          echo "- Route, area, and municipality-only records cannot replace the ritual or main-venue anchor" >> "$GITHUB_STEP_SUMMARY"
          echo "- Records without a concrete anchor show an explicit no-map state instead of a decorative city map" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public HTML contains no map API key" >> "$GITHUB_STEP_SUMMARY"
          echo "- Search and browse titles open real detail pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exhaustive navigation is verified in Chromium" >> "$GITHUB_STEP_SUMMARY"
          REPORT="artifacts/matsuri-map-utility/map-utility-audit.json"
          if [ -f "$REPORT" ]; then
            CHECKED=$(node -e "const x=require('./$REPORT'); console.log(x.summary.checked_detail_count)")
            ANCHORED=$(node -e "const x=require('./$REPORT'); console.log(x.summary.anchored_detail_count)")
            GAPS=$(node -e "const x=require('./$REPORT'); console.log(x.summary.location_gap_count)")
            echo "- Map utility inventory: $CHECKED checked, $ANCHORED anchored, $GAPS location gaps" >> "$GITHUB_STEP_SUMMARY"
          fi
