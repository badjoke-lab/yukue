name: Sync Jiin lockfile

on:
  push:
    branches:
      - feat/start-jiin-specialist-site
    paths:
      - ".github/workflows/sync-jiin-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: sync-jiin-lockfile
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/start-jiin-specialist-site

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.10.0

      - name: Generate synchronized lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Sync lockfile for Jiin workspace"
          git push origin HEAD:feat/start-jiin-specialist-site
