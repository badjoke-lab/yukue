name: Audit Matsuri corpus coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/audit-matsuri-corpus-coverage.yml"
      - "apps/matsuri/scripts/load-matsuri-dataset.mjs"
      - "apps/matsuri/src/data/**"
      - "data/public/matsuri/**"
      - "scripts/audit-matsuri-corpus-coverage.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-matsuri-corpus-coverage.yml"
      - "apps/matsuri/scripts/load-matsuri-dataset.mjs"
      - "apps/matsuri/src/data/**"
      - "data/public/matsuri/**"
      - "scripts/audit-matsuri-corpus-coverage.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build corpus coverage report
        run: pnpm audit:matsuri:corpus -- --output artifacts/matsuri-corpus-coverage

      - name: Publish report in workflow summary
        if: always()
        run: |
          if [ -f artifacts/matsuri-corpus-coverage/report.md ]; then
            cat artifacts/matsuri-corpus-coverage/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Matsuri corpus coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload corpus coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matsuri-corpus-coverage-${{ github.sha }}
          path: artifacts/matsuri-corpus-coverage/
          if-no-files-found: error
          retention-days: 14
