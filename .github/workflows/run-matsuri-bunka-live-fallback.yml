name: Run Matsuri Bunka live fallback

on:
  push:
    branches:
      - feat/matsuri-bunka-html-fallback
    paths:
      - ".github/workflows/run-matsuri-bunka-live-fallback.yml"
      - "scripts/check-matsuri-bunka-live-detail.mjs"
      - "scripts/lib/matsuri-bunka-detail-acquisition.mjs"
      - "scripts/run-matsuri-bunka-detail-readiness.mjs"
      - "scripts/lib/matsuri-national-csv-acquisition.mjs"
      - "scripts/lib/matsuri-tier-a-importer.mjs"

permissions:
  contents: read

jobs:
  live-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify one known Bunka detail live
        run: node scripts/check-matsuri-bunka-live-detail.mjs
      - name: Run bounded live detail acquisition and readiness
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          node scripts/run-matsuri-bunka-detail-readiness.mjs \
            --output .artifacts/matsuri-bunka-live \
            --accessed-at "$(TZ=Asia/Tokyo date +%F)" \
            --max-id 1000 \
            --concurrency 4 \
            --delay-ms 125 2>&1 | tee .artifacts/matsuri-bunka-live.log
      - name: Upload live readiness artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matsuri-bunka-live-readiness-${{ github.sha }}
          path: |
            .artifacts/matsuri-bunka-live/
            .artifacts/matsuri-bunka-live.log
          if-no-files-found: error
          retention-days: 7
