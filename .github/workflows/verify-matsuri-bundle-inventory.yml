name: Verify Matsuri bundle inventory and repository baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-bundle-inventory.yml"
      - "apps/matsuri/scripts/load-matsuri-dataset.mjs"
      - "apps/matsuri/src/data/matsuri-projection.ts"
      - "config/jinja-start-gate.json"
      - "config/matsuri-analytics-activation.json"
      - "config/matsuri-f2-launch-gate.json"
      - "config/matsuri-repository-baseline.json"
      - "data/public/matsuri/f1/**"
      - "data/public/matsuri/f2/**"
      - "docs/matsuri-repository-baseline.md"
      - "docs/project-status.md"
      - "scripts/check-matsuri-bundle-inventory.mjs"
      - "scripts/check-matsuri-repository-baseline.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-bundle-inventory.yml"
      - "apps/matsuri/scripts/load-matsuri-dataset.mjs"
      - "apps/matsuri/src/data/matsuri-projection.ts"
      - "config/jinja-start-gate.json"
      - "config/matsuri-analytics-activation.json"
      - "config/matsuri-f2-launch-gate.json"
      - "config/matsuri-repository-baseline.json"
      - "data/public/matsuri/f1/**"
      - "data/public/matsuri/f2/**"
      - "docs/matsuri-repository-baseline.md"
      - "docs/project-status.md"
      - "scripts/check-matsuri-bundle-inventory.mjs"
      - "scripts/check-matsuri-repository-baseline.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-bundle-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0

      - name: Verify bundle inventory, order, and current repository baseline
        shell: bash
        run: |
          set -o pipefail
          pnpm check:matsuri:bundle-inventory 2>&1 | tee matsuri-bundle-baseline-verification.log

      - name: Upload failed baseline verification log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matsuri-bundle-baseline-verification-log
          path: matsuri-bundle-baseline-verification.log
          if-no-files-found: error
          retention-days: 7

      - name: Write verification summary
        if: always()
        run: |
          echo "## Matsuri bundle inventory and repository baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical loader and HTML Public Projection must enumerate the same F1, maintenance, and correction bundles" >> "$GITHUB_STEP_SUMMARY"
          echo "- Current counts and completed F2 / blocked Jinja boundaries must match the machine baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Narrative status documents must reference the machine baseline without duplicating exact current count tables" >> "$GITHUB_STEP_SUMMARY"
          echo "- A focused failure log is retained when verification fails" >> "$GITHUB_STEP_SUMMARY"
