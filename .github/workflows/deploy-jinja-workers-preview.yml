name: Deploy Jinja workers.dev preview

on:
  push:
    branches:
      - main
    paths:
      - "apps/jinja/**"
      - "packages/ui/**"
      - "config/jinja-preview-deployment-gate.json"
      - "config/jinja-implementation-gate.json"
      - "config/jinja-start-gate.json"
      - "scripts/build-jinja-workers-preview.mjs"
      - "scripts/check-jinja-preview-deployment.mjs"
      - "wrangler.jinja.preview.jsonc"
      - "package.json"
      - ".github/workflows/deploy-jinja-workers-preview.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 17 26 8 *"

permissions:
  contents: read

concurrency:
  group: deploy-jinja-workers-preview
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    environment: jinja-workers-preview
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.10.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify Jinja preview gate
        run: |
          pnpm check:yukue:jinja-start-gate
          pnpm check:jinja:preview-deployment

      - name: Build Jinja preview
        run: pnpm build:jinja:workers-preview

      - name: Deploy Jinja workers.dev preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jinja.preview.jsonc

      - name: Verify public preview
        shell: bash
        run: |
          node <<'NODE'
          const url = 'https://jinja-yukue.badjoke-lab.workers.dev/';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let last = 'no response';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(url, { cache: 'no-store' });
              const text = await response.text();
              if (response.ok && text.includes('神社のゆくえ') && text.includes('Public preview')) {
                console.log(`Jinja workers.dev preview reachable: ${response.status} (attempt ${attempt})`);
                process.exit(0);
              }
              last = `HTTP ${response.status}; expected preview markers missing`;
            } catch (error) {
              last = error instanceof Error ? error.message : String(error);
            }
            console.log(`Jinja preview verification attempt ${attempt}/12 failed: ${last}`);
            if (attempt < 12) await sleep(5000);
          }
          console.error(`Jinja workers.dev preview verification failed after 12 attempts: ${last}`);
          process.exit(1);
          NODE

      - name: Record deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment 311 --repo "$REPOSITORY" --body "Jinja workers.dev preview deployment: **${DEPLOY_STATUS}**

          - run: https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}
          - commit: \`${COMMIT_SHA}\`
          - preview: https://jinja-yukue.badjoke-lab.workers.dev/

          This record covers only the noncanonical noindex workers.dev preview."
