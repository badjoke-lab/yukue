name: Deploy Jinja workers.dev preview

on:
  push:
    branches:
      - main
    paths:
      - "apps/jinja/**"
      - "config/jinja-preview-deployment-gate.json"
      - "config/jinja-implementation-gate.json"
      - "config/jinja-start-gate.json"
      - "scripts/build-jinja-workers-preview.mjs"
      - "scripts/check-jinja-preview-deployment.mjs"
      - "wrangler.jinja.preview.jsonc"
      - "package.json"
      - ".github/workflows/deploy-jinja-workers-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-jinja-workers-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: jinja-workers-preview
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.10.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify Jinja preview gate
        run: |
          pnpm check:yukue:jinja-start-gate
          pnpm check:jinja:preview-deployment

      - name: Build Jinja preview
        run: pnpm build:jinja:workers-preview

      - name: Deploy Jinja workers.dev preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jinja.preview.jsonc

      - name: Verify public preview
        run: |
          node -e "fetch('https://jinja-yukue.badjoke-lab.workers.dev/').then(async r => { const t = await r.text(); if (!r.ok || !t.includes('神社のゆくえ') || !t.includes('Public preview')) process.exit(1); console.log('Jinja workers.dev preview reachable:', r.status); })"
