name: Diagnose Matsuri repository gate

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      - '.github/workflows/diagnose-matsuri-repository-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.10.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: repository baseline
        continue-on-error: true
        run: node scripts/check-matsuri-repository-baseline.mjs
      - name: repository bundles
        continue-on-error: true
        run: node scripts/check-matsuri-repository-bundles.mjs
      - name: open maintenance records
        continue-on-error: true
        run: node scripts/check-matsuri-open-maintenance-records.mjs
      - name: bootstrap consistency
        continue-on-error: true
        run: node scripts/check-matsuri-bootstrap-consistency.mjs
      - name: corpus quality baseline
        continue-on-error: true
        run: node scripts/check-matsuri-corpus-quality-baseline.mjs
      - name: detail equivalence
        continue-on-error: true
        run: node scripts/check-matsuri-detail-equivalence.mjs
      - name: summary tags
        continue-on-error: true
        run: node scripts/check-matsuri-summary-tags.mjs
      - name: updated-at consistency
        continue-on-error: true
        run: node scripts/check-matsuri-updated-at-consistency.mjs
      - name: external link coverage
        continue-on-error: true
        run: node scripts/check-matsuri-external-link-coverage.mjs
      - name: search coverage
        continue-on-error: true
        run: node scripts/check-matsuri-search-coverage.mjs
      - name: materialize coverage
        continue-on-error: true
        run: node scripts/check-matsuri-materialize-coverage.mjs
      - name: relation coverage
        continue-on-error: true
        run: node scripts/check-matsuri-relation-coverage.mjs
      - name: event responsive
        continue-on-error: true
        run: node scripts/check-matsuri-event-responsive.mjs
      - name: css properties
        continue-on-error: true
        run: node scripts/check-matsuri-css-properties.mjs
      - name: typography overrides
        continue-on-error: true
        run: node scripts/check-matsuri-typography-overrides.mjs
      - name: contract breaks
        continue-on-error: true
        run: node scripts/check-matsuri-contract-breaks.mjs
      - name: archive candidates
        continue-on-error: true
        run: pnpm check:matsuri:archive:candidates
      - name: relation classifier
        continue-on-error: true
        run: pnpm check:matsuri:relation:classifier
      - name: detail payload size
        continue-on-error: true
        run: pnpm check:matsuri:detail:payload-size
      - name: index rollout verify
        continue-on-error: true
        run: pnpm audit:matsuri:index-rollout:verify
      - name: inx13
        continue-on-error: true
        run: pnpm check:matsuri:inx13
      - name: inx14
        continue-on-error: true
        run: pnpm check:matsuri:inx14
      - name: index diff
        continue-on-error: true
        run: pnpm check:matsuri:index:diff
      - name: index model alignment
        continue-on-error: true
        run: pnpm check:matsuri:index-model-alignment
