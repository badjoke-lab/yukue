name: Verify Jinja start-gate record

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-jinja-start-gate.yml"
      - "config/jinja-start-gate.json"
      - "config/matsuri-stabilization-review.json"
      - "scripts/check-jinja-start-gate-record.mjs"
      - "scripts/check-matsuri-stabilization-review.mjs"
      - "apps/**"
      - "data/public/matsuri/**"
      - "docs/jinja-start-gate.md"
      - "docs/matsuri-stabilization-review.md"
      - "docs/project-status.md"
      - "docs/development-schedule.md"
      - "wrangler*.jsonc"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-jinja-start-gate.yml"
      - "config/jinja-start-gate.json"
      - "config/matsuri-stabilization-review.json"
      - "scripts/check-jinja-start-gate-record.mjs"
      - "scripts/check-matsuri-stabilization-review.mjs"
      - "apps/**"
      - "data/public/matsuri/**"
      - "docs/jinja-start-gate.md"
      - "docs/matsuri-stabilization-review.md"
      - "docs/project-status.md"
      - "docs/development-schedule.md"
      - "wrangler*.jsonc"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-jinja-start-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0

      - name: Validate Matsuri stabilization record
        run: pnpm check:matsuri:stabilization-review

      - name: Validate Jinja start-gate record
        run: pnpm check:yukue:jinja-start-gate

      - name: Write verification summary
        if: always()
        run: |
          echo "## Jinja start-gate record" >> "$GITHUB_STEP_SUMMARY"
          echo "- Matsuri F2-28: complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Matsuri stabilization review: reviewing / incomplete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: blocked by four post-launch prerequisites" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seed preparation: 26 Relation-backed Jinja candidates" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authorization: no app, Worker, hostname, publication, or State inference" >> "$GITHUB_STEP_SUMMARY"
