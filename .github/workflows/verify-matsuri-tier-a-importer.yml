name: Verify Matsuri Tier A importer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-tier-a-importer.yml"
      - "config/matsuri-national-source-inventory.json"
      - "config/matsuri-tier-a-importer-contract.json"
      - "docs/matsuri-tier-a-importer.md"
      - "fixtures/matsuri-tier-a-importer/**"
      - "scripts/lib/matsuri-tier-a-importer.mjs"
      - "scripts/lib/matsuri-tier-a-publication-generator.mjs"
      - "scripts/import-matsuri-tier-a-candidates.mjs"
      - "scripts/generate-matsuri-tier-a-publication-wave.mjs"
      - "scripts/check-matsuri-tier-a-importer.mjs"
      - "scripts/check-matsuri-tier-a-publication-generator.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-tier-a-importer.yml"
      - "config/matsuri-national-source-inventory.json"
      - "config/matsuri-tier-a-importer-contract.json"
      - "docs/matsuri-tier-a-importer.md"
      - "fixtures/matsuri-tier-a-importer/**"
      - "scripts/lib/matsuri-tier-a-importer.mjs"
      - "scripts/lib/matsuri-tier-a-publication-generator.mjs"
      - "scripts/import-matsuri-tier-a-candidates.mjs"
      - "scripts/generate-matsuri-tier-a-publication-wave.mjs"
      - "scripts/check-matsuri-tier-a-importer.mjs"
      - "scripts/check-matsuri-tier-a-publication-generator.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tier-a-importer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify NCS-04 Tier A importer contract
        run: pnpm check:matsuri:tier-a-importer

      - name: Verify bounded Tier A publication generator
        run: node scripts/check-matsuri-tier-a-publication-generator.mjs
