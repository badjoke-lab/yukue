name: Verify Matsuri stabilization review

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-stabilization-review.yml"
      - "config/matsuri-stabilization-review.json"
      - "config/matsuri-f2-launch-gate.json"
      - "config/jinja-start-gate.json"
      - "scripts/check-matsuri-stabilization-review.mjs"
      - "docs/matsuri-stabilization-review.md"
      - "docs/audits/matsuri-stabilization-*.md"
      - "docs/project-status.md"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-stabilization-review.yml"
      - "config/matsuri-stabilization-review.json"
      - "config/matsuri-f2-launch-gate.json"
      - "config/jinja-start-gate.json"
      - "scripts/check-matsuri-stabilization-review.mjs"
      - "docs/matsuri-stabilization-review.md"
      - "docs/audits/matsuri-stabilization-*.md"
      - "docs/project-status.md"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stabilization-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0

      - name: Validate stabilization state machine and negative fixtures
        run: pnpm check:matsuri:stabilization-review

      - name: Write verification summary
        if: always()
        run: |
          echo "## Matsuri stabilization review" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: observing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Started: 2026-07-27" >> "$GITHUB_STEP_SUMMARY"
          echo "- Earliest review: 2026-08-10" >> "$GITHUB_STEP_SUMMARY"
          echo "- Elapsed time alone cannot complete the review" >> "$GITHUB_STEP_SUMMARY"
          echo "- Search-engine indexation is observed but is not required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Negative fixtures prove rejection of premature completion, missing evidence, critical corrections, and removed boundaries" >> "$GITHUB_STEP_SUMMARY"
