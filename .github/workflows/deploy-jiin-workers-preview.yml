name: Deploy Jiin workers.dev preview

on:
  push:
    branches:
      - main
    paths:
      - "apps/jiin/**"
      - "packages/ui/**"
      - "wrangler.jiin.preview.jsonc"
      - "config/jiin-preview-deployment-gate.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-jiin-workers-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-jiin-workers-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: jinja-workers-preview
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.10.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify Jiin preview authorization
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const gate = JSON.parse(fs.readFileSync('config/jiin-preview-deployment-gate.json', 'utf8'));
          if (gate.status !== 'workers-dev-preview-authorized') throw new Error('Jiin preview is not authorized');
          if (gate.scope?.workers_dev_origin !== 'https://jiin-yukue.badjoke-lab.workers.dev') throw new Error('Unexpected Jiin preview origin');
          if (gate.authorization?.canonical_publication_authorized !== false) throw new Error('Canonical publication must remain blocked');
          NODE

      - name: Build Jiin preview
        run: pnpm --filter @badjoke-lab/yukue-jiin build

      - name: Deploy Jiin workers.dev preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jiin.preview.jsonc

      - name: Verify public preview
        shell: bash
        run: |
          node <<'NODE'
          const origin = 'https://jiin-yukue.badjoke-lab.workers.dev';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let last = 'no response';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const [homeResponse, robotsResponse] = await Promise.all([
                fetch(`${origin}/`, { cache: 'no-store' }),
                fetch(`${origin}/robots.txt`, { cache: 'no-store' }),
              ]);
              const [home, robots] = await Promise.all([homeResponse.text(), robotsResponse.text()]);
              if (
                homeResponse.ok &&
                robotsResponse.ok &&
                home.includes('寺院のゆくえ') &&
                home.includes('寺院を探す') &&
                home.includes('name="robots" content="noindex,nofollow"') &&
                robots.includes('Disallow: /')
              ) {
                console.log(`Jiin workers.dev preview reachable: ${homeResponse.status} (attempt ${attempt})`);
                process.exit(0);
              }
              last = `HTTP ${homeResponse.status}; expected series-parity preview markers missing`;
            } catch (error) {
              last = error instanceof Error ? error.message : String(error);
            }
            if (attempt < 12) await sleep(5000);
          }
          console.error(`Jiin preview verification failed: ${last}`);
          process.exit(1);
          NODE
