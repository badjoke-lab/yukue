name: Acquire Jinja national candidates

on:
  push:
    branches: [main]
    paths:
      - "apps/jinja/scripts/acquire-national-candidates.mjs"
      - "apps/jinja/scripts/check-national-acquisition.mjs"
      - "apps/jinja/research/national-acquisition-policy.json"
  workflow_dispatch:
  schedule:
    - cron: "23 18 1 * *"

permissions:
  contents: read

concurrency:
  group: jinja-national-candidates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        prefecture: [JP-01,JP-02,JP-03,JP-04,JP-05,JP-06,JP-07,JP-08,JP-09,JP-10,JP-11,JP-12,JP-13,JP-14,JP-15,JP-16,JP-17,JP-18,JP-19,JP-20,JP-21,JP-22,JP-23,JP-24,JP-25,JP-26,JP-27,JP-28,JP-29,JP-30,JP-31,JP-32,JP-33,JP-34,JP-35,JP-36,JP-37,JP-38,JP-39,JP-40,JP-41,JP-42,JP-43,JP-44,JP-45,JP-46,JP-47]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate acquisition contract
        run: node apps/jinja/scripts/check-national-acquisition.mjs
      - name: Acquire prefecture candidates
        run: node apps/jinja/scripts/acquire-national-candidates.mjs --prefecture ${{ matrix.prefecture }} --out-dir .artifacts/jinja-national-candidates/${{ matrix.prefecture }}
      - name: Upload prefecture candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jinja-national-candidates-${{ matrix.prefecture }}-${{ github.sha }}
          path: .artifacts/jinja-national-candidates/${{ matrix.prefecture }}/
          if-no-files-found: error
          retention-days: 30
