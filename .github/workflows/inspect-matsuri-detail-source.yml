name: Inspect Matsuri detail source

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-matsuri-detail-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: List detail source and test contracts
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== MATSURI SOURCE FILES ==="
            find apps/matsuri/src -type f -print | sort
            echo "=== BROWSER TEST FILES ==="
            find tests/browser -type f -print | sort
            echo "=== DETAIL SOURCE MATCHES ==="
            grep -RInE '関係する場所・組織|根拠と出典|機械可読データ|Year by Year|Connections|findMatsuriEntityDetail|suneori-amagoi' apps/matsuri/src tests/browser packages scripts || true
          } | tee matsuri-detail-source-inspection.txt

      - name: Upload inspection output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matsuri-detail-source-inspection
          path: matsuri-detail-source-inspection.txt
          if-no-files-found: error
          retention-days: 1
