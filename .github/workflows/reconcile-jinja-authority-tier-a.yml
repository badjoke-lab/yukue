name: Reconcile Jinja authority Tier A

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-jinja-authority-tier-a.yml"
      - "apps/jinja/scripts/promote-authority-tier-a.mjs"
      - "apps/jinja/scripts/fetch-chiba-authority-roster.py"
      - "apps/jinja/scripts/fetch-kanagawa-authority-roster.py"
      - "apps/jinja/scripts/fetch-tokyo-authority-roster.py"
      - "apps/jinja/scripts/fetch-saitama-authority-roster.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reconcile-jinja-authority-tier-a.yml"
      - "apps/jinja/scripts/promote-authority-tier-a.mjs"
      - "apps/jinja/scripts/fetch-chiba-authority-roster.py"
      - "apps/jinja/scripts/fetch-kanagawa-authority-roster.py"
      - "apps/jinja/scripts/fetch-tokyo-authority-roster.py"
      - "apps/jinja/scripts/fetch-saitama-authority-roster.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pinned legacy XLS reader
        run: python3 -m pip install --disable-pip-version-check --no-input xlrd==2.0.2

      - name: Resolve latest successful national aggregate
        id: aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/aggregate-jinja-national-candidates.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Jinja national aggregate run found" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using national aggregate run $RUN_ID"

      - name: Download national aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.aggregate.outputs.run_id }}
        run: |
          mkdir -p .artifacts/jinja-national-aggregate
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'jinja-national-aggregate-*' \
            --dir .artifacts/jinja-national-aggregate
          AGGREGATE="$(find .artifacts/jinja-national-aggregate -name national-candidates.json -type f | head -n 1)"
          test -n "$AGGREGATE"
          cp "$AGGREGATE" .artifacts/national-candidates.json

      - name: Fetch authority rosters
        run: |
          python3 apps/jinja/scripts/fetch-chiba-authority-roster.py \
            --out .artifacts/chiba-authority-roster.json
          python3 apps/jinja/scripts/fetch-kanagawa-authority-roster.py \
            --out .artifacts/kanagawa-authority-roster.json
          python3 apps/jinja/scripts/fetch-tokyo-authority-roster.py \
            --out .artifacts/tokyo-authority-roster.json
          python3 apps/jinja/scripts/fetch-saitama-authority-roster.py \
            --out .artifacts/saitama-authority-roster.json

      - name: Reconcile authority matches into one canonical tree
        run: |
          promote() {
            slug="$1"
            set +e
            node apps/jinja/scripts/promote-authority-tier-a.mjs \
              --aggregate .artifacts/national-candidates.json \
              --authority ".artifacts/${slug}-authority-roster.json" \
              --canonical apps/jinja/data/canonical.json \
              --report "apps/jinja/research/authority-verification/${slug}-latest.json"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              node - "$slug" <<'NODE'
          const fs = require('fs');
          const slug = process.argv[2];
          const report = JSON.parse(fs.readFileSync(`apps/jinja/research/authority-verification/${slug}-latest.json`, 'utf8'));
          if (report.approved_count !== 0) process.exit(1);
          console.log(`${slug}: already reconciled; no new approved matches.`);
          NODE
            fi
          }

          promote chiba
          promote kanagawa
          promote tokyo
          promote saitama
          node apps/jinja/scripts/check-data.mjs

      - name: Write reconciliation summary
        run: |
          node - <<'NODE' | tee /tmp/jinja-authority-reconcile-summary.txt
          const fs = require('fs');
          const slugs = ['chiba', 'kanagawa', 'tokyo', 'saitama'];
          const authorities = Object.fromEntries(slugs.map((slug) => {
            const report = JSON.parse(fs.readFileSync(`apps/jinja/research/authority-verification/${slug}-latest.json`, 'utf8'));
            return [slug, {
              approved: report.approved_count,
              ambiguous: report.ambiguous_count,
              match_rules: report.match_rules ?? {},
            }];
          }));
          const canonical = JSON.parse(fs.readFileSync('apps/jinja/data/canonical.json', 'utf8'));
          console.log(JSON.stringify({
            authorities,
            canonical_entities_after: canonical.entities.length,
            states_after: canonical.states.length,
            events_after: canonical.events.length,
          }));
          NODE
          {
            echo '## Jinja public-authority Tier A reconciliation'
            echo
            echo '```json'
            cat /tmp/jinja-authority-reconcile-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push one generated review branch
        if: github.event_name != 'pull_request'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if git diff --quiet -- \
            apps/jinja/data/canonical.json \
            apps/jinja/research/authority-verification/chiba-latest.json \
            apps/jinja/research/authority-verification/kanagawa-latest.json \
            apps/jinja/research/authority-verification/tokyo-latest.json \
            apps/jinja/research/authority-verification/saitama-latest.json; then
            echo "Authority reconciliation is already up to date; no review branch needed."
            exit 0
          fi
          BRANCH="automation/jinja-authority-reconcile-${RUN_ID}-${RUN_ATTEMPT}"
          git config user.name "badjoke-lab automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            apps/jinja/data/canonical.json \
            apps/jinja/research/authority-verification/chiba-latest.json \
            apps/jinja/research/authority-verification/kanagawa-latest.json \
            apps/jinja/research/authority-verification/tokyo-latest.json \
            apps/jinja/research/authority-verification/saitama-latest.json
          git commit -m "DATA: reconcile Jinja public-authority Tier A records"
          git push origin "$BRANCH"
          echo "Generated branch: $BRANCH"
