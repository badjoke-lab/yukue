name: Verify Matsuri national candidate acquisition

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-national-candidate-acquisition.yml"
      - "config/matsuri-national-source-inventory.json"
      - "scripts/lib/matsuri-national-csv-acquisition.mjs"
      - "scripts/acquire-matsuri-national-candidates.mjs"
      - "scripts/check-matsuri-national-candidate-acquisition.mjs"
      - "scripts/lib/matsuri-tier-a-importer.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-matsuri-national-candidate-acquisition.yml"
      - "config/matsuri-national-source-inventory.json"
      - "scripts/lib/matsuri-national-csv-acquisition.mjs"
      - "scripts/acquire-matsuri-national-candidates.mjs"
      - "scripts/check-matsuri-national-candidate-acquisition.mjs"
      - "scripts/lib/matsuri-tier-a-importer.mjs"

permissions:
  contents: read

jobs:
  verify-national-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify official CSV to candidate-batch adapter
        run: node scripts/check-matsuri-national-candidate-acquisition.mjs
